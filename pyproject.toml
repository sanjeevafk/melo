[project]
name = "echoread"
version = "0.1.0"
description = "Local temporal-RAG audiobook companion"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.12,<1",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "huggingface-hub>=0.34,<2",
    "faster-whisper>=1.1,<2",
    "fermion-research>=0.2.14,<1",
    "sentence-transformers>=6.1,<7",
    "transformers>=4.57,<6",
    "torch>=2.5,<3",
    "llama-cpp-python>=0.3.16,<1",
    "kokoro-onnx>=0.4.7,<1",
    "soundfile>=0.12,<1",
    "pillow>=13.0.0",
    "torchvision>=0.29.1",
    "av<19",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false
# fermion-research pins torch <2.3 on Intel macOS, which conflicts with torch>=2.5.
# EchoRead targets Linux x86_64 and Apple Silicon (see the implementation plan).
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/app/tests"]
asyncio_mode = "auto"
addopts = "-q"
